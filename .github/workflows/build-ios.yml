name: Build Jump Force Mugen iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install go

      - name: Prepare builder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _builder
          mkdir -p _builder
          unzip -q Jump_Force_Mugen_iOS_Builder.zip -d _builder
          echo "Builder contents:"
          find _builder -maxdepth 4 -type f | sort | head -200

      - name: Locate iOS build script
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="$(find _builder -type f -name 'build_ios.sh' -print -quit)"
          if [ -z "$SCRIPT" ]; then
            echo "build_ios.sh was not found in the builder archive."
            exit 1
          fi
          DIR="$(cd "$(dirname "$SCRIPT")" && pwd)"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found: $SCRIPT"

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.locate.outputs.dir }}"
          chmod +x build_ios.sh
          ./build_ios.sh

      - name: Find IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find "$GITHUB_WORKSPACE/_builder" "$GITHUB_WORKSPACE" -type f -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [ -z "$IPA" ]; then
            echo "No IPA was produced."
            echo "Build output:"
            find "$GITHUB_WORKSPACE/_builder" -maxdepth 6 -type f | sort | tail -200
            exit 1
          fi
          cp "$IPA" "$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa"
          echo "IPA: $IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jump-Force-Mugen-iOS-IPA
          path: Jump-Force-Mugen-iOS.ipa
          if-no-files-found: error