name: Build Jump Force Mugen iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Install native build dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew install pkg-config nasm yasm libxmp sdl2 molten-vk
          echo "Go: $(go version)"
          echo "Architecture: $(uname -m)"
          echo "pkg-config: $(pkg-config --version)"
          echo "clang: $(clang --version | head -1)"

      - name: Install resilient download and FFmpeg patch wrappers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-bin" "$GITHUB_WORKSPACE/.ci"

          cat > "$GITHUB_WORKSPACE/.ci/patch_ffmpeg.py" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          if not p.is_file():
              raise SystemExit(f"FFmpeg configure not found: {p}")

          s = p.read_text()
          if 'Host compiler lacks C11 support' not in s:
              print("FFmpeg host-C11 fatal check not present; no patch needed.")
              raise SystemExit(0)

          patched = re.sub(
              r'\s*\|\| die "Host compiler lacks C11 support"',
              '',
              s,
              count=1,
          )
          if patched == s:
              raise SystemExit("Could not safely patch FFmpeg host-C11 check.")
          p.write_text(patched)
          print("Applied FFmpeg macOS host-C11 compatibility patch.")
          PY

          cat > "$GITHUB_WORKSPACE/.ci-bin/curl" <<'SH'
          #!/bin/bash
          exec /usr/bin/curl --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 "$@"
          SH

          cat > "$GITHUB_WORKSPACE/.ci-bin/git" <<'SH'
          #!/bin/bash
          /usr/bin/git "$@"
          rc=$?
          if [ "$rc" -eq 0 ] && [ "${1:-}" = "checkout" ] && [ "$(basename "$PWD")" = "ffmpeg-src" ]; then
            if [ -f "$PWD/configure" ]; then
              python3 "$GITHUB_WORKSPACE/.ci/patch_ffmpeg.py" "$PWD/configure"
            fi
          fi
          exit "$rc"
          SH

          chmod +x "$GITHUB_WORKSPACE/.ci-bin/curl" "$GITHUB_WORKSPACE/.ci-bin/git"
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Prepare builder
        shell: bash
        run: |
          set -euo pipefail
          test -f Jump_Force_Mugen_iOS_Builder.zip
          rm -rf _builder
          mkdir -p _builder
          unzip -q Jump_Force_Mugen_iOS_Builder.zip -d _builder
          ROOT="_builder/Jump_Force_Mugen_New_Starter"
          SCRIPT="$ROOT/build/build_ios.sh"
          test -f "$SCRIPT"
          chmod +x "$SCRIPT"
          bash -n "$SCRIPT"

      - name: Build unsigned IPA
        shell: bash
        env:
          HOSTCC: /usr/bin/clang
          HOSTCXX: /usr/bin/clang++
          HOSTLD: /usr/bin/clang
          HOSTCFLAGS: -std=c11
          HOSTCXXFLAGS: -std=c++11
        run: |
          set -euo pipefail
          cd "_builder/Jump_Force_Mugen_New_Starter/build"
          ./build_ios.sh

      - name: Locate and validate IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find "$GITHUB_WORKSPACE/_builder" "$GITHUB_WORKSPACE" -type f -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [ -z "$IPA" ]; then
            echo "ERROR: build_ios.sh completed without producing an IPA."
            find "$GITHUB_WORKSPACE/_builder" -maxdepth 12 -type f | sort | tail -300
            exit 1
          fi
          cp "$IPA" "$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa"
          test -s "$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa"
          file "$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa"
          unzip -tq "$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa"
          echo "path=$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa" >> "$GITHUB_OUTPUT"
          ls -lh "$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jump-Force-Mugen-iOS-IPA
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14
