name: Build Jump Force Mugen iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Install native build dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew install git pkg-config nasm yasm libxmp sdl2 molten-vk
          echo "Go: $(go version)"
          echo "NASM: $(nasm -v | head -1)"
          echo "YASM: $(yasm --version | head -1)"
          echo "pkg-config: $(pkg-config --version)"

      - name: Prepare builder
        shell: bash
        run: |
          set -euo pipefail
          test -f Jump_Force_Mugen_iOS_Builder.zip
          rm -rf _builder
          mkdir -p _builder
          unzip -q Jump_Force_Mugen_iOS_Builder.zip -d _builder
          test -f "_builder/Jump_Force_Mugen_New_Starter/build/build_ios.sh"

      - name: Harden MoltenVK download
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="_builder/Jump_Force_Mugen_New_Starter/build/build_ios.sh"
          python3 - "$SCRIPT" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          marker = 'MoltenVK-ios.tar'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('MoltenVK-ios.tar was not found; refusing to build.')
          start = s.rfind('download_file', 0, pos)
          if start < 0:
              raise SystemExit('MoltenVK download_file call was not found; refusing to build.')
          tail = s[pos:]
          m = re.search(r'["\']\$work/MoltenVK-ios\\.tar["\']', tail)
          if not m:
              raise SystemExit('MoltenVK output path was not found; refusing to build.')
          end = pos + m.end()
          replacement = '''curl -fL --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 \\\n  -o "$work/MoltenVK-ios.tar" \\\n  "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar"'''.strip()
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          print('Patched MoltenVK downloader with 10 retries and a 15-minute transfer timeout.')
          PY
          grep -n -A3 -B2 'MoltenVK-ios.tar' "$SCRIPT"

      - name: Validate build script
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="_builder/Jump_Force_Mugen_New_Starter/build/build_ios.sh"
          chmod +x "$SCRIPT"
          bash -n "$SCRIPT"

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "_builder/Jump_Force_Mugen_New_Starter/build"
          ./build_ios.sh

      - name: Locate and validate IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find "$GITHUB_WORKSPACE/_builder" "$GITHUB_WORKSPACE" -type f -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [ -z "$IPA" ]; then
            echo "ERROR: build_ios.sh completed without producing an IPA."
            find "$GITHUB_WORKSPACE/_builder" -maxdepth 10 -type f | sort | tail -250
            exit 1
          fi
          cp "$IPA" "$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa"
          test -s "$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa"
          echo "path=$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa" >> "$GITHUB_OUTPUT"
          ls -lh "$GITHUB_WORKSPACE/Jump-Force-Mugen-iOS.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jump-Force-Mugen-iOS-IPA
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14